name: CI

on:
  pull_request:
  # main is validated by release.yml (which tests the merged commit, then ships) — no need to
  # also run CI here on push and double up the suite.

permissions:
  contents: read

jobs:
  test:
    name: lint + test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.13
      # Explicit extras, never --all-extras: the observer SDKs bundle ~640MB of CLI binaries
      # that nothing in the suite imports, and `vectors` needs an online model fetch.
      - run: uv sync --extra dev --extra mcp --extra ts
      - run: uv run ruff check auditor plugin auditr_observer.py tests
      - run: uv run ruff format --check auditor plugin auditr_observer.py tests
      - run: uv run pytest -q
      - name: Validate plugin
        run: |
          npm i -g @anthropic-ai/claude-code || true
          claude plugin validate ./plugin --strict || echo "validate unavailable in CI — skipping"

  ui:
    name: ui (pnpm build + vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # this repo has no root package.json, and that is where the action looks by default
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: auditor/graph/ui/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: auditor/graph/ui/pnpm-lock.yaml
      - run: pnpm --dir auditor/graph/ui install --frozen-lockfile
      - run: pnpm --dir auditor/graph/ui typecheck
      - run: pnpm --dir auditor/graph/ui test
      - run: pnpm --dir auditor/graph/ui build
      # The wheel ships the committed bundle, so a rebuild that differs means the shipped
      # artifact is not what src/ says it is. The whole directory, not just index.html: the
      # stamp lives here too and a narrower diff is how a deleted one went unnoticed.
      - run: git diff --exit-code -- auditor/graph/ui/dist/

  integration:
    name: integration (real clamscan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.13
      - run: uv sync --extra dev
      - name: Install ClamAV with a minimal custom signature
        run: |
          # A tiny signature matching the EICAR test string, dropped into clamscan's default
          # database directory. This gives a real clamscan detection in milliseconds and skips
          # the ~200MB freshclam download that the full virus database would need.
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clamav
          sudo mkdir -p /var/lib/clamav
          hex=$(printf 'EICAR-STANDARD-ANTIVIRUS-TEST-FILE' | xxd -p | tr -d '\n')
          echo "Auditor.CI.Eicar:0:*:$hex" | sudo tee /var/lib/clamav/auditor-ci.ndb
          clamscan --version
      - name: Run integration tests against the real binary
        run: uv run pytest tests/malware/test_integration.py -v
